name: Backend Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: 실제-배포-버킷명
  CODEDEPLOY_APP: lounge-backend
  CODEDEPLOY_GROUP: lounge-deployment-group

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::767397859048:role/lounge-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build Spring Boot JAR
        run: ./gradlew clean bootJar

      - name: Prepare deployment package
        run: |
          mkdir -p deploy/scripts
          cp build/libs/lounge-backend.jar deploy/app.jar
          cp appspec.yml deploy/appspec.yml
          cp scripts/*.sh deploy/scripts/
          chmod +x deploy/scripts/*.sh
          cd deploy
          zip -r ../deploy.zip .

      - name: Check deployment package
        run: unzip -l deploy.zip

      - name: Upload artifact to S3
        run: |
          aws s3 cp deploy.zip \
            s3://${S3_BUCKET}/deployments/${GITHUB_SHA}.zip

      - name: Deploy with CodeDeploy
        id: deploy
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${CODEDEPLOY_APP} \
            --deployment-group-name ${CODEDEPLOY_GROUP} \
            --s3-location bucket=${S3_BUCKET},key=deployments/${GITHUB_SHA}.zip,bundleType=zip \
            --description "GitHub Actions deployment ${GITHUB_SHA}" \
            --query 'deploymentId' \
            --output text)

          echo "Deployment ID: ${DEPLOYMENT_ID}"
          echo "deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          aws deploy wait deployment-successful \
            --deployment-id ${{ steps.deploy.outputs.deployment_id }}

      - name: Show deployment result
        run: |
          aws deploy get-deployment \
            --deployment-id ${{ steps.deploy.outputs.deployment_id }} \
            --query 'deploymentInfo.[deploymentId,status]' \
            --output table