spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: binteum
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000 # 1시간