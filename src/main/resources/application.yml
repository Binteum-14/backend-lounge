spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: lounge
  profiles:
   default: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000 # 1시간
  refresh-token-expiration: 1209600000 # 14일

guest-session:
  expiration: 1800000 # 30분

presence:
  expiration: 180000 # 3분

incheon-airport:
  api:
    base-url: https://apis.data.go.kr/B551177/StatusOfPassengerFlightsOdp
    service-key: ${INCHEON_AIRPORT_SERVICE_KEY}
    cache-ttl: 3600000 # 1시간
openai:
  api-key: ${OPENAI_API_KEY}
  base-url: https://api.openai.com/v1
  model: ${OPENAI_MODEL:gpt-5.6-terra}
  max-output-tokens: 1500

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET}

app:
  public-url: ${BACKEND_PUBLIC_URL}